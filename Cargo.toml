[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/persistence",
    "crates/identity",
    "crates/operations",
    "crates/eventing",
    "crates/idempotency",
    "crates/ingest",
    "crates/scheduling",
    "crates/api-doc",
    "crates/public-api",
    "crates/http",
    "services/edge",
    "services/ingest",
    "services/scheduler",
    "tools/openapic",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"                       # equals the pinned toolchain; no MSRV promise we cannot check
license      = "BSD-3-Clause"
repository   = "https://github.com/po4yka/ratatoskr-platform"

[workspace.dependencies]
# ---- in-repo ----
ratatoskr-platform-core      = { version = "0.1.0", path = "crates/core" }
ratatoskr-platform-telemetry = { version = "0.1.0", path = "crates/telemetry" }
ratatoskr-platform-persistence = { version = "0.1.0", path = "crates/persistence" }
ratatoskr-platform-identity    = { version = "0.1.0", path = "crates/identity" }
ratatoskr-platform-operations  = { version = "0.1.0", path = "crates/operations" }
ratatoskr-platform-eventing    = { version = "0.1.0", path = "crates/eventing" }
ratatoskr-platform-idempotency = { version = "0.1.0", path = "crates/idempotency" }
ratatoskr-platform-ingest      = { version = "0.1.0", path = "crates/ingest" }
ratatoskr-platform-scheduling  = { version = "0.1.0", path = "crates/scheduling" }
ratatoskr-platform-api-doc     = { version = "0.1.0", path = "crates/api-doc" }
ratatoskr-platform-public-api  = { version = "0.1.0", path = "crates/public-api" }
ratatoskr-platform-http      = { version = "0.1.0", path = "crates/http" }

# ---- ratatoskr-contracts ----------------------------------------------------------------------
# The only sanctioned interim form (contracts/README.md, "Workspace integration"): a git dependency
# pinned to a full commit SHA. A branch moves and a tag can be moved, so neither pins.
# The transport is `https://` because ratatoskr-contracts is a PUBLIC repository, so an anonymous
# fetch resolves it. An `ssh://` URL would need a deploy key, which is a long-lived private key in
# CI that protects nothing readable (SECURITY.md: deny by default; THREAT_MODEL.md treats a CI
# credential as an asset, and the cheapest way to secure an asset is not to hold it). If contracts
# ever becomes private this reverts to `ssh://` and the key becomes real.
# ONE rev for every contract crate, declared ONLY here. Two revs of the same git source are two
# distinct packages, so `EntityRef` from one would not unify with `EntityRef` from the other and the
# compiler error would be baffling.
# Replaced by a version requirement when contracts milestone 10 publishes.
ratatoskr-identifiers     = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "b7aa013c78ef73eb2a5798935e74167c4cf98314" }
ratatoskr-error-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "b7aa013c78ef73eb2a5798935e74167c4cf98314" }
ratatoskr-event-envelope  = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "b7aa013c78ef73eb2a5798935e74167c4cf98314" }
ratatoskr-operation-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "b7aa013c78ef73eb2a5798935e74167c4cf98314" }
ratatoskr-social-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "b7aa013c78ef73eb2a5798935e74167c4cf98314" }

# ---- persistence ----
# No `migrate` feature: the schema is one file, `include_str!`d into the binary by
# `ratatoskr-platform-persistence`, so a deployment cannot drift from its schema and there is no
# ledger to record.
# `time` rather than `chrono`: contracts uses jiff on the wire, neither is a native sqlx type, and
# `time::OffsetDateTime` converts to a jiff::Timestamp through unix nanoseconds without a calendar.
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "macros",
] }

# ---- async runtime and HTTP ----
tokio      = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum       = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing"] }
tower      = "0.5.3"
tower-http = { version = "0.7.0", default-features = false, features = ["catch-panic", "limit", "timeout"] }
http       = "1.5.0"
http-body-util = "0.1.5"
hyper          = { version = "1.11.0", features = ["client", "http1"] }
hyper-util     = { version = "0.1.20", features = ["client-legacy", "tokio", "http1"] }

# ---- configuration ----
figment = { version = "0.10.19", features = ["env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
url     = { version = "2.5.8", features = ["serde"] }

# ---- telemetry ----
tracing                     = "0.1.44"
tracing-subscriber          = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "fmt", "json", "ansi"] }
tracing-opentelemetry       = "0.33.0"
opentelemetry               = "0.32.0"
opentelemetry_sdk           = { version = "0.32.1", features = ["rt-tokio", "trace"] }
# The three `tls-*` features are load-bearing, not defensive. Without a TLS feature the exporter
# REFUSES to build for an `https://` endpoint ("uses HTTPS but no TLS feature is enabled"), so the
# process exits 1 — while validation rule V7 and `.env.example` both advertise `https`, and the one
# milestone-1 secret is the collector `authorization` header that travels on this link.
# `tls-ring` is the crypto provider; the two root sets are the trust anchors, and tonic merges them:
# `tls-webpki-roots` works in an image with no CA bundle, `tls-roots` picks up a private CA an
# operator installed in the image's trust store.
opentelemetry-otlp          = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace", "tls-ring", "tls-roots", "tls-webpki-roots"] }
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# ---- identity and time on the boundary between the database and the wire ----
# `uuid` v7 because ratatoskr-contracts mints v7 and the database stores the same bytes.
# `v5` for ONE thing: a schedule occurrence's identifier is a function of the schedule and the due
# time, which is what makes duplicate publication refusable by a primary key (ARCHITECTURE.md S14).
# The SHA-1 underneath v5 is not a security control there — both inputs are values this system
# minted, and nothing is authenticated by the digest.
uuid = { version = "1.18.1", features = ["v5", "v7", "serde"] }
# `time` is sqlx's timestamptz type here; contracts speaks jiff. The two convert through unix
# nanoseconds, which needs no calendar and cannot be ambiguous.
time = { version = "0.3.44", default-features = false, features = ["std"] }
jiff = { version = "0.2.15", default-features = false, features = ["std"] }
cron = "0.17.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# ---- the bus ----
# JetStream, not core NATS: ARCHITECTURE S8.2 assumes at-least-once delivery with redelivery and a
# dead-letter path, and core NATS is at-most-once with no persistence at all.
async-nats   = "0.50.0"
# Stream combinators for the JetStream message stream. No executor, no runtime.
# Generator syntax for the one place a stream is authored by hand.
async-stream = "0.3.6"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

# ---- schema generation ----
# The SAME pin `ratatoskr-contracts` uses, and it must stay the same: two schemars versions in one
# graph are two `JsonSchema` traits, so a contract type would not implement the one this
# repository's generator calls. Q5 in DEVELOPMENT.md records that this pin is graph-wide.
schemars = { version = "=1.2.2", features = ["uuid1", "jiff02"] }

# ---- hashing and signatures ----
# SHA-256 for the idempotency key and request fingerprint. Not a password hash and not used as one.
sha2 = "0.10.9"
# Ed25519 VERIFICATION for identity assertions (ADR-0011). `ring` rather than a new signature crate
# because it is already in the graph beneath rustls, so this adds a direct dependency and not a
# dependency. Platform holds only public keys: it verifies assertions and cannot issue one.
ring = "0.17.14"
# base64url for the two-part assertion token. Already in the graph; `default-features = false` keeps
# it out of the allocator-free paths it does not need.
base64 = "0.22.1"

# ---- serialization and errors ----
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror  = "2.0.20"

# ---- dev only ----

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro          = "deny"
todo               = "deny"
print_stdout       = "deny"     # startup failures go to stderr; a stray println bypasses the subscriber
# `panic`, `unwrap_used` and `expect_used` above close every EXPLICIT panic path and leave the most
# common implicit one open. Both of these are `allow` by default and in `clippy::restriction`, so
# `pedantic` does not enable them. Measured at zero violations in this workspace when adopted.
indexing_slicing   = "deny"     # `v[i]` and `&s[a..b]` panicking out of bounds
string_slice       = "deny"     # `&s[..n]` panicking because n is not a UTF-8 char boundary
# contracts' `float_arithmetic = "deny"` is deliberately NOT adopted. Its rationale is that a wire
# schema must not carry a float; Platform records f64 latency seconds into a histogram, so adopting
# it would buy two `#[allow]`s that exist only to work around an inapplicable lint.

# Release profile: `panic` is left at the default `unwind` ON PURPOSE. `panic = "abort"` silently
# disables `CatchPanicLayer` (`catch_unwind` cannot run) and turns every handler panic into a
# process abort with no ErrorEnvelope and no log line.
[profile.release]
debug = 1          # line tables only: a usable backtrace in the ERROR log, no full debuginfo
