[package]
name        = "ratatoskr-edge"
description = "Public control-plane listener: the Ratatoskr Edge deployable."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-edge"
path = "src/main.rs"

[dependencies]
ratatoskr-platform-core.workspace = true
ratatoskr-platform-http.workspace = true
tracing.workspace = true
uuid.workspace = true
jiff.workspace = true
sqlx.workspace = true
ratatoskr-platform-operations.workspace = true
ratatoskr-platform-eventing.workspace = true
axum.workspace = true
ratatoskr-platform-persistence.workspace = true
ratatoskr-platform-public-api.workspace = true
base64.workspace = true
tokio.workspace = true

[dev-dependencies]
ratatoskr-platform-persistence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
