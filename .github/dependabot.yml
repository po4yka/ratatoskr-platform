# Only the github-actions ecosystem. `cargo` is deliberately absent: this repository commits its
# Cargo.lock and runs every command with `--locked`, which makes a dependency bump a deliberate act
# rather than a chore, and `cargo deny check` in the gate already reports an advisory the moment it is
# published. A monthly pull request rewriting the lockfile would be reviewing our own noise.
#
# Action pins are the opposite case: they rot silently, and a pin whose `# vX.Y.Z` comment no longer
# matches its SHA cannot be checked by reading the diff. Dependabot updates the SHA and the comment
# together, which is exactly the class of mistake that broke this workflow's first run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]          # one pull request, not one per action
    commit-message:
      prefix: chore
    # Seven days between an action's release and the pull request that proposes it. A SHA pin defends
    # against a tag being moved under us; it does nothing about a release that is malicious on the day
    # it is published, because Dependabot would then hand us the attacker's commit with a version
    # comment that looks correct. A week is the window in which such a release is normally withdrawn.
    # zizmor reports the absence of one as `dependabot-cooldown`.
    cooldown:
      default-days: 7
