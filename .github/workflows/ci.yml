# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
#
# The contracts git dependency needs NO credential: ratatoskr-contracts is a public repository and
# `https://` resolves it anonymously. This job therefore holds no secret at all.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The integration suite talks to a real PostgreSQL on purpose: ADR-0004 chose runtime-checked
    # queries, so this service is what replaces the compile-time checking the `sqlx::query!` macros
    # would have given. Without it the suite does not run and the queries are unverified.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
          # Byte-identical to compose.yaml. Without it this cluster is created with the runner's
          # glibc collation while a developer's is created with ICU, so a text index sorts
          # differently in the two places that are supposed to be checking each other.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases. Matches compose.yaml, so the
      # same command works on a laptop and here.
      PLATFORM_TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform
      PLATFORM_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is left behind in
          # .git/config for no reason. Deny by default applies to the token too.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # NATS runs as an explicit container rather than a service, because a service container cannot
      # be given a command and `--jetstream` is not the image default. Without the flag every publish
      # is refused and the publisher tests fail for a reason that has nothing to do with the code.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine \
            --jetstream --http_port 8222
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz | grep -q ok; then exit 0; fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          docker logs nats >&2
          exit 1

      - run: cargo fetch --locked

      # Reads RustSec, the licence set, duplicate versions and the source policy. Nothing else in the
      # gate looks at any of them, and the graph was carrying five advisories in the TLS path of the
      # public-facing binary for six milestones because of it.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - run: cargo deny check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Before the tests, not after: services/edge/tests/boot.rs executes ratatoskr-ingest and
      # ratatoskr-scheduler as child processes, and `cargo test` builds the binary of the package
      # under test only — a sibling package's plain binary is never produced by it. Without this step
      # three of the four boot tests fail on any target directory that a previous `cargo build` has
      # not already populated, which is every clean checkout, CI or laptop.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and the rule had no enforcement — the same
      # defect class as a document claiming a capability the tree lacks. It passes today, so it starts
      # as a guard rather than as a backlog item.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '/^[[:space:]]+- run: cargo /{sub(/^[[:space:]]+- run: /,""); print}' \
                  .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'
