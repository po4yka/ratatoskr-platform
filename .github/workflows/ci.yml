# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
#
# The contracts git dependency needs NO credential: ratatoskr-contracts is a public repository and
# `https://` resolves it anonymously. This job therefore holds no secret at all.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request the newest push is the only one whose answer matters, and cancelling the
  # superseded run is what makes the queue keep up. On `main` it is the opposite: a cancelled run
  # leaves that commit with no verdict at all, and `main` is the branch whose history is supposed to
  # record whether each commit passed. Two pushes a minute apart would otherwise erase the first
  # one's result permanently — the log is the only place it ever existed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The integration suite talks to a real PostgreSQL on purpose: ADR-0004 chose runtime-checked
    # queries, so this service is what replaces the compile-time checking the `sqlx::query!` macros
    # would have given. Without it the suite does not run and the queries are unverified.
    services:
      postgres:
        # Pinned by digest, not by tag. A service container runs on the runner beside the checkout
        # and the build, on the same network, so a compromised `postgres:17` is a path to the crates.io
        # downloads that produce the release binary — the same threat that makes every action here a
        # SHA. This digest is `postgres:17` as it stood on 2026-08-19: PostgreSQL 17.11. It is the
        # multi-architecture index rather than one image, so the pin constrains the version and not the
        # runner. zizmor reports the tag form as `unpinned-images`.
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
          # Byte-identical to compose.yaml. Without it this cluster is created with the runner's
          # glibc collation while a developer's is created with ICU, so a text index sorts
          # differently in the two places that are supposed to be checking each other.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases. Matches compose.yaml, so the
      # same command works on a laptop and here.
      PLATFORM_TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5432/platform
      PLATFORM_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is left behind in
          # .git/config for no reason. Deny by default applies to the token too.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # NATS runs as an explicit container rather than a service, because a service container cannot
      # be given a command and `--jetstream` is not the image default. Without the flag every publish
      # is refused and the publisher tests fail for a reason that has nothing to do with the code.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine \
            --jetstream --http_port 8222
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz | grep -q ok; then exit 0; fi
            sleep 1
          done
          echo "NATS did not become healthy" >&2
          docker logs nats >&2
          exit 1

      - run: cargo fetch --locked

      # Reads RustSec, the licence set, duplicate versions and the source policy. Nothing else in the
      # gate looks at any of them, and the graph was carrying five advisories in the TLS path of the
      # public-facing binary for six milestones because of it.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny
      - run: cargo deny check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Before the tests, not after: services/edge/tests/boot.rs executes ratatoskr-ingest and
      # ratatoskr-scheduler as child processes, and `cargo test` builds the binary of the package
      # under test only — a sibling package's plain binary is never produced by it. Without this step
      # three of the four boot tests fail on any target directory that a previous `cargo build` has
      # not already populated, which is every clean checkout, CI or laptop.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and the rule had no enforcement — the same
      # defect class as a document claiming a capability the tree lacks. It passes today, so it starts
      # as a guard rather than as a backlog item.
      #
      # The awk is scoped to the `gate` job. Reading the whole file was a latent trap: DEVELOPMENT.md
      # documents THIS job's command list, so the first commit adding a second job with a cargo step
      # would have failed the guard with "DEVELOPMENT.md is the one that is wrong" — pointing the
      # author at the wrong file entirely. A top-level job key is a bare name at two spaces, which is
      # what the first rule tracks.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'

  # The artifact the deployment actually runs, built for the architecture it runs on.
  #
  # The gate above certifies an x86-64 binary. The target is `aarch64`
  # (`ratatoskr-workspace/docs/DEPLOYMENT_TARGET.md`), so without this job the binary CI blesses
  # cannot execute on the machine and the binary that can is compiled by nobody and tested by nobody
  # — an architecture-specific codegen or feature-gate difference would first be seen in production.
  #
  # A NATIVE arm64 runner, not QEMU on the x86 gate. This repository is public, so GitHub's arm64
  # runners cost nothing here, and emulating a 368-crate Rust build is the difference between minutes
  # and hours.
  #
  # It builds and smoke-tests the artifact rather than re-running the suite. The suite's job is to
  # check behaviour and it already does that; this job's job is to answer one question the suite
  # cannot — does the thing we ship start on the thing we ship it to.
  artifact:
    name: linux/arm64 artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --tag ratatoskr-platform:ci .

      # Every deployable, because the `check-config` branch is wired into each `main` separately and
      # a binary that cannot load its configuration cannot start. Ingest is expected to REFUSE: it
      # carries no compiled public port, so 78 is its correct answer here and 0 would be the defect.
      - name: Every binary loads its configuration
        run: |
          set -euo pipefail
          run() { docker run --rm "$@"; }
          run ratatoskr-platform:ci ratatoskr-edge check-config >/dev/null
          run ratatoskr-platform:ci ratatoskr-scheduler check-config >/dev/null
          run -e RATATOSKR__PUBLIC__BIND=127.0.0.1:8181 \
              ratatoskr-platform:ci ratatoskr-ingest check-config >/dev/null
          if run ratatoskr-platform:ci ratatoskr-ingest check-config >/dev/null 2>&1; then
            echo "::error::ingest must refuse to start without an explicit public bind"
            exit 1
          fi

      # The whole lifecycle against the real artifact: apply the migrations on aarch64, declare the
      # JetStream streams, bind both listeners, answer the operator plane, take SIGTERM, exit 0.
      #
      # It runs `ratatoskr-edge` and not `ratatoskr-scheduler` because at milestone 9 there is no
      # role that serves without a database: the scheduler reads its schedules from one, and a
      # process that started anyway would report itself ready and publish nothing forever. Edge is
      # the role that also OWNS the migrations, so this step is the only place the SQL is applied on
      # the target's architecture before the target sees it.
      - name: The artifact serves and stops cleanly
        run: |
          set -euo pipefail
          # `--network host` for all three, so every address in this step is 127.0.0.1 — the same
          # loopback URL `DEVELOPMENT.md` documents for a local run. A user-defined network would
          # need a container name in the database URL, and a URL with a credential and a real-looking
          # host is the one thing the pre-commit credential check refuses.
          docker run -d --name smoke-db --network host \
            -e POSTGRES_USER=platform -e POSTGRES_PASSWORD=platform -e POSTGRES_DB=platform \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8" \
            postgres:17
          docker run -d --name smoke-bus --network host \
            nats:2-alpine --jetstream --store_dir=/data
          for _ in $(seq 1 60); do
            if docker exec smoke-db pg_isready -U platform -d platform >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker run -d --name smoke --network host \
            -e RATATOSKR__ADMIN__BIND=127.0.0.1:9464 \
            -e RATATOSKR__PUBLIC__BIND=127.0.0.1:8080 \
            -e RATATOSKR__DATABASE__URL=postgres://platform:platform@127.0.0.1:5432/platform \
            -e RATATOSKR__BUS__URL=nats://127.0.0.1:4222 \
            ratatoskr-platform:ci ratatoskr-edge
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9464/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9464/health/ready | tee /dev/stderr | grep -q '"state":"ready"'
          echo
          # `git_sha` is compiled in through `option_env!`, so an image built without the build
          # argument reports "unknown" — the first thing anyone checks when a deployment misbehaves.
          curl -sf http://127.0.0.1:9464/version | tee /dev/stderr | grep -q "$GITHUB_SHA"
          curl -sf http://127.0.0.1:9464/metrics | grep -q '^platform_build_info'
          # The migrations really ran on aarch64 — every one of them, through sqlx's own migrator
          # rather than a `create table` that happened to exist. A stream that could not be declared
          # is already covered: edge refuses to start without one, so readiness above would never
          # have arrived.
          applied=$(docker exec smoke-db psql -U platform -d platform -Atc \
            "select count(*) from _sqlx_migrations where success")
          test "$applied" = "$(find migrations -name '*.sql' | wc -l | tr -d ' ')"
          docker stop -t 40 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = "0"
          docker rm -f smoke smoke-db smoke-bus
