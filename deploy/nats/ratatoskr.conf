# The NATS server on the deployment target.
#
#     /etc/nats/ratatoskr.conf, loaded with `nats-server -c /etc/nats/ratatoskr.conf`
#
# Verified against a real `nats:2` server on 2026-08-19, not inferred. Every claim in the comments
# below was produced by driving this permission set with the same `async-nats` version the binaries
# link: the streams were created, a command was published and acknowledged, the durable consumer was
# created and fetched from, and the three refusals happened.

port: 4222
server_name: ratatoskr

# Bound to every interface INSIDE the container's network namespace, because a server bound to the
# container's own 127.0.0.1 refuses the connections Docker forwards from the published port (it was
# written as 127.0.0.1 here until XR-021, and the published port accepted a TCP connection and then
# reset it). The publication is the boundary, not this bind: `compose.yaml` publishes 4222 and 8222 on
# the host's 127.0.0.1 only, `ratatoskr-workspace/docs/DEPLOYMENT_TARGET.md` allocates both with no
# external reachability, and 4222 additionally requires an nkey. Do not publish either port on
# another address, and do not run this file outside a container without putting 127.0.0.1 back.
host: 0.0.0.0

# Operator surface (the monitoring endpoint). Same rule: reachable on the host's loopback through the
# published port, over Tailscale from there, and by nothing else.
http: 0.0.0.0:8222

jetstream {
    # NVMe, never the boot device. JetStream's write pattern is small synchronous fsyncs, which is
    # the worst case for SD-card wear, and an SD card that wears out takes the root filesystem with
    # it. An absolute path and never a named volume: a named volume lands wherever DockerRootDir
    # points, which a reflash resets.
    store_dir: /mnt/nvme/ratatoskr/nats

    # Both streams are declared with max_bytes = 1 GiB (`platform_eventing::stream`), so 8 GiB of
    # file store is room for both plus their indexes and a wide margin. Stated rather than defaulted:
    # the default is 75% of the filesystem, which on a 466 GB device is not a limit.
    max_file_store: 8GB
    max_memory_store: 256MB
}

# ---------------------------------------------------------------------------------------------
# authorization
# ---------------------------------------------------------------------------------------------
#
# Platform has one identity, and that is the decision rather than an omission. `ARCHITECTURE.md` S18
# gives ingest and scheduler "limited command publish permissions", written when each role was
# assumed to publish for itself. ADR-0013 decides otherwise: those two write commands into
# `operations.outbox` and `ratatoskr-edge` is the only process that moves them to the broker, so
# their publish permission is a PostgreSQL grant on that table and they hold no NATS credential at
# all. Provider consumers below have separate identities limited to their pre-provisioned durables.
#
# An nkey and not a `.creds` file. A `.creds` file carries its permissions inside a signed account
# JWT, so the answer to "what may this identity publish?" would live in a blob on the host; here it
# lives in this file, in the repository, where a change to it is a diff somebody reviews. The public
# nkey below is not a secret — the seed is, and it is the file the unit names in
# RATATOSKR__BUS__NKEY_SEED_PATH.
#
# Replace the nkey with the one printed by `deploy/nats/README.md`'s generation step. The value here
# is a placeholder and authenticates nobody who does not hold its seed.

authorization {
    users: [
        # EDGE. The only identity that creates anything. It declares both streams, every fixed
        # durable of the table in `platform_eventing::stream` and the `browser_worker_completions`
        # KV bucket, and it publishes every command the outbox pump emits. Deploy order: this
        # identity comes first. Reload NATS with this file, restart Edge, and only then start the
        # services below, because each of them verifies a durable that Edge created and refuses to
        # become ready without it.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EDGE_XXXXXXXXXX
            permissions: {
                publish: {
                    # `cmd.>` is what the outbox pump emits. `evt.>` is deliberately ABSENT: events
                    # are facts published by the domain services that produced them, and Platform
                    # consumes them. The day Platform publishes an event of its own, this line is
                    # the diff that says so.
                    #
                    # `$JS.API.>` is the JetStream control plane — creating the two streams,
                    # creating the durable consumers, and fetching from them. Narrowing it further
                    # was tried and rejected: the exact API subjects a client uses are a property of
                    # the client version, so a tight allowlist turns a dependency bump into a process
                    # that dies at startup with "no responders". No other identity holds it.
                    #
                    # `$JS.ACK.>` is where a consumer acknowledges. Without it every fetched message
                    # would be redelivered forever.
                    allow: ["cmd.>", "$JS.API.>", "$JS.ACK.>"]

                    # Deny wins over allow. These two are the operations that would destroy work a
                    # client was told had been accepted, and no Ratatoskr process performs either:
                    # `platform_eventing::stream::ensure` creates and describes, and reports a
                    # mismatch for an operator to resolve by hand.
                    deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"]
                }
                subscribe: {
                    # Replies only. A JetStream client receives everything — stream info, consumer
                    # info, fetched messages — on its own inbox, so this is the whole subscribe
                    # surface. It cannot subscribe to `cmd.>` or `evt.>` directly, which means a
                    # compromised edge cannot silently tap the bus.
                    allow: ["_INBOX.>"]
                }
            }
        },
        # TELEGRAM. Durable: ratatoskr_telegram_notifications. It receives only Platform-raised
        # notifications through this fixed durable. It may inspect, fetch, and acknowledge that
        # durable, but it cannot create a different consumer, directly subscribe to events, or
        # publish any Ratatoskr command or fact. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_TELEGRAM_XXXX
            permissions: {
                publish: {
                    allow: [
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_telegram_notifications",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_telegram_notifications",
                        "$JS.ACK.ratatoskr_events.ratatoskr_telegram_notifications.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # CHATGPT and CLAUDE. Durables: none. AI archive importers publish their own progress report
        # ingress subject and the eight archive fact subjects Knowledge consumes, and nothing else.
        # The report envelope remains platform.operation.reported.v1; Edge checks the provider
        # binding again. Neither can read the bus. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_CHATGPT_XXXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.ai-archive.chatgpt.operation.reported.v1",
                        "evt.ai_archive.archive.imported.v1",
                        "evt.ai_archive.conversation.added.v1",
                        "evt.ai_archive.conversation.updated.v1",
                        "evt.ai_archive.project.added.v1",
                        "evt.ai_archive.project.updated.v1",
                        "evt.ai_archive.artifact.added.v1",
                        "evt.ai_archive.artifact.updated.v1",
                        "evt.ai_archive.subject.tombstoned.v1",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_CLAUDE_XXXXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.ai-archive.claude.operation.reported.v1",
                        "evt.ai_archive.archive.imported.v1",
                        "evt.ai_archive.conversation.added.v1",
                        "evt.ai_archive.conversation.updated.v1",
                        "evt.ai_archive.project.added.v1",
                        "evt.ai_archive.project.updated.v1",
                        "evt.ai_archive.artifact.added.v1",
                        "evt.ai_archive.artifact.updated.v1",
                        "evt.ai_archive.subject.tombstoned.v1",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # X. Durables: ratatoskr_x_browser_capture (commands) and ratatoskr_x_extractor_reports
        # (operation reports for its linked-article captures). Each social owner may inspect, fetch
        # from, and acknowledge only the durables Edge pre-provisions for it. In particular,
        # `$JS.API.>` is NOT granted here: an identity allowed to create a consumer could pick a
        # foreign filter and read another provider's commands through its private inbox. X also
        # publishes the generic capture command for a linked article. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_X_XXXXXXXXXXXXX
            permissions: {
                publish: {
                    allow: [
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_x_browser_capture",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_x_browser_capture",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_x_browser_capture.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_x_extractor_reports",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_x_extractor_reports",
                        "$JS.ACK.ratatoskr_events.ratatoskr_x_extractor_reports.>",
                        "evt.platform.operation.reported.v1",
                        "evt.social.source.captured.v1",
                        "evt.social.source.updated.v1",
                        "evt.social.source.removed.v1",
                        "cmd.content.capture.requested.v1",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # INSTAGRAM. Durable: ratatoskr_instagram_browser_capture. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_INSTAGRAM_XXXXX
            permissions: {
                publish: {
                    allow: [
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_instagram_browser_capture",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_instagram_browser_capture",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_instagram_browser_capture.>",
                        "evt.platform.operation.reported.v1",
                        "evt.social.source.captured.v1",
                        "evt.social.source.updated.v1",
                        "evt.social.source.removed.v1",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # THREADS. Durable: threads_browser_capture. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_THREADS_XXXXXXX
            permissions: {
                publish: {
                    allow: [
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.threads_browser_capture",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.threads_browser_capture",
                        "$JS.ACK.ratatoskr_commands.threads_browser_capture.>",
                        "evt.platform.operation.reported.v1",
                        "evt.social.source.captured.v1",
                        "evt.social.source.updated.v1",
                        "evt.social.source.removed.v1",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # EXTRACTOR. Durables: ratatoskr_extractor_capture (the capture commands it works) and
        # ratatoskr_extractor_render_awaits (the render results it waits on, no acknowledgements).
        # Its stanza was an `evt.>` and `$JS.API.>` fragment that could read every tenant's events
        # and create consumers; that fragment is deleted, not narrowed in place. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EXTRACTOR_XXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.content.document.extracted.v1",
                        "evt.platform.operation.reported.v1",
                        "cmd.content.render.requested.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_extractor_capture",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_extractor_capture",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_extractor_capture.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_extractor_render_awaits",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_extractor_render_awaits",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # EXTRACTOR_BROWSER_WORKER. Durable: ratatoskr_browser_worker. KV bucket:
        # browser_worker_completions (Edge creates it; the worker opens it, reads and writes keys).
        # The three KV grants are the subjects async-nats 0.50 uses to open a bucket, read a key with
        # direct get and write one; they were derived from the client source and are proven by the
        # real-broker matrix in `crates/eventing/tests/deployed_nats_config.rs`. If a client upgrade
        # needs another KV subject, add exactly that subject here and never `$JS.API.>`.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EXTRACTOR_BROWSER_WORKER_XXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.content.render.completed.v1",
                        "evt.content.render.failed.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_browser_worker",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_browser_worker",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_browser_worker.>",
                        "$JS.API.STREAM.INFO.KV_browser_worker_completions",
                        "$JS.API.DIRECT.GET.KV_browser_worker_completions.>",
                        "$KV.browser_worker_completions.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # KNOWLEDGE. Durables: ratatoskr_knowledge_channel_recap (commands), and on events
        # ratatoskr_knowledge_documents, ratatoskr_knowledge_social_sources,
        # ratatoskr_knowledge_ai_archive and ratatoskr_knowledge_repository_requests. One seed serves
        # the ingest and the channel recap workers (`knowledge.nkey`). Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_KNOWLEDGE_XXXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.knowledge.analysis.completed.v1",
                        "evt.knowledge.ai_archive_analysis.completed.v1",
                        "evt.knowledge.repository_analysis.completed.v1",
                        "evt.knowledge.repository_analysis.failed.v1",
                        "evt.knowledge.channel_digest_recap.completed.v1",
                        "evt.knowledge.channel_digest_recap.failed.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_knowledge_channel_recap",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_knowledge_channel_recap",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_knowledge_channel_recap.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_knowledge_documents",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_knowledge_documents",
                        "$JS.ACK.ratatoskr_events.ratatoskr_knowledge_documents.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_knowledge_social_sources",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_knowledge_social_sources",
                        "$JS.ACK.ratatoskr_events.ratatoskr_knowledge_social_sources.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_knowledge_ai_archive",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_knowledge_ai_archive",
                        "$JS.ACK.ratatoskr_events.ratatoskr_knowledge_ai_archive.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_knowledge_repository_requests",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_knowledge_repository_requests",
                        "$JS.ACK.ratatoskr_events.ratatoskr_knowledge_repository_requests.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # GITHUB. Durables: ratatoskr_github_analysis_completed, ratatoskr_github_analysis_failed and
        # ratatoskr_github_policy_acknowledged. It asks Knowledge for a repository analysis and asks
        # Vault to apply a backup policy. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_GITHUB_XXXXXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.knowledge.repository_analysis.requested.v1",
                        "cmd.vault.backup_policy.apply_requested.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_analysis_completed",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_analysis_completed",
                        "$JS.ACK.ratatoskr_events.ratatoskr_github_analysis_completed.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_analysis_failed",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_analysis_failed",
                        "$JS.ACK.ratatoskr_events.ratatoskr_github_analysis_failed.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_github_policy_acknowledged",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_github_policy_acknowledged",
                        "$JS.ACK.ratatoskr_events.ratatoskr_github_policy_acknowledged.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # VAULT. Durable: ratatoskr_vault_backup_policy. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_VAULT_XXXXXXXX
            permissions: {
                publish: {
                    allow: [
                        "evt.vault.backup_policy.acknowledged.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_vault_backup_policy",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_vault_backup_policy",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_vault_backup_policy.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        },
        # CHANNEL_DIGESTS. Durables: ratatoskr_channel_digest_subscriptions,
        # ratatoskr_channel_digest_runs, ratatoskr_channel_digest_schedule_occurrences (commands from
        # Platform) and ratatoskr_channel_digest_recap_completed, ratatoskr_channel_digest_recap_failed
        # (Knowledge's answers). It publishes the recap request, its operation reports, and the one
        # command that registers its schedule with Platform. Worker role only. Start after Edge.
        {
            nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_CHANNEL_DIGESTS_XXXXX
            permissions: {
                publish: {
                    allow: [
                        "cmd.knowledge.channel_digest_recap.requested.v1",
                        "evt.platform.operation.reported.v1",
                        "cmd.platform.schedule.registration_requested.v1",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_channel_digest_subscriptions",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_channel_digest_subscriptions",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_channel_digest_subscriptions.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_channel_digest_runs",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_channel_digest_runs",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_channel_digest_runs.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_channel_digest_schedule_occurrences",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_channel_digest_schedule_occurrences",
                        "$JS.ACK.ratatoskr_commands.ratatoskr_channel_digest_schedule_occurrences.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_channel_digest_recap_completed",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_channel_digest_recap_completed",
                        "$JS.ACK.ratatoskr_events.ratatoskr_channel_digest_recap_completed.>",
                        "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_channel_digest_recap_failed",
                        "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_channel_digest_recap_failed",
                        "$JS.ACK.ratatoskr_events.ratatoskr_channel_digest_recap_failed.>",
                    ]
                }
                subscribe: { allow: ["_INBOX.>"] }
            }
        }
    ]
}

# ---------------------------------------------------------------------------------------------
# What a refusal looks like
# ---------------------------------------------------------------------------------------------
#
# THE CLIENT CANNOT TELL A PERMISSION DENIAL FROM AN UNREACHABLE BROKER. A denied publish is simply
# never acknowledged, so `async-nats` reports "timed out: didn't receive ack in time" and the outbox
# records "the message was not acknowledged by the bus", backs the row off and eventually
# dead-letters it — the same text it would produce if NATS were down.
#
# The server does say so, on its own log, with the subject and the nkey:
#
#     [ERR] ... - "$G/nkey:U..." - Publish Violation - Subject "evt.content.captured.v1"
#
# So the diagnosis for a dead-lettered command whose last error is "not acknowledged" is: look at
# the NATS log before assuming the broker was down.
