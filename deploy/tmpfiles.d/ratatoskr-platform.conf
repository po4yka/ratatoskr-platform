# The age field stays `-` on purpose. ratatoskr-edge owns removal: its staging reaper deletes the
# directory of a transfer that expired, failed, finalized or was abandoned, and deletes the database
# row only after the directory is gone (XR-021 R5-04). An age here would let systemd-tmpfiles remove
# the directory of an upload that is still being resumed while its row stayed behind.
d /mnt/nvme/ratatoskr/archive-staging 0700 ratatoskr-edge ratatoskr-edge -
