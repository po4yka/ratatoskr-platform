# Local development dependencies. NOT a deployment artifact: the deployment profile is `deploy/`,
# and it is systemd units on one host with an existing PostgreSQL cluster (ADR-0013). The two
# differences that matter here are that this NATS accepts anonymous connections and this
# PostgreSQL has one superuser, where the target has an nkey identity with a subject allowlist and
# three least-privilege roles.
#
# PostgreSQL for the two owned schemas, and NATS JetStream for the outbox publisher (milestone 4).
#
# The credentials here are local-only and deliberately obvious. SECURITY.md forbids production
# credentials in the repository, and a password that looks like a real one invites reuse.

services:
  postgres:
    # Pinned to the major version the deployment target runs, which is 17
    # (`ratatoskr-workspace/docs/DEPLOYMENT_TARGET.md`). ADR-0004 chose runtime-checked queries, so
    # this container is the ONLY verification the SQL gets — against a different major it verifies
    # the wrong thing. A major upgrade is a migration exercise, not a tag bump.
    image: postgres:17
    container_name: ratatoskr-platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
      # Deterministic collation, so an index built on a developer's laptop sorts like one built in CI.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # `pg_isready` returns success while the server is still replaying WAL, so the check also runs a
      # trivial query. A migration that starts too early fails with a confusing connection error.
      test: ["CMD-SHELL", "pg_isready -U platform -d platform && psql -U platform -d platform -c 'select 1' > /dev/null"]
      interval: 1s
      timeout: 5s
      retries: 30
    # The data directory is a named volume rather than a bind mount, so `docker compose down -v` is
    # the documented reset and no stray directory appears in the working tree.
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data

  nats:
    # JetStream, not core NATS: the outbox assumes at-least-once delivery with redelivery and a
    # dead-letter path, and core NATS is at-most-once with no persistence at all.
    image: nats:2-alpine
    container_name: ratatoskr-platform-nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      # `/healthz` reports JetStream readiness, not just that the port is open.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - platform-nats-data:/data

volumes:
  platform-postgres-data:
  platform-nats-data:
