[package]
name        = "ratatoskr-platform-operations"
description = "The operations schema, the lifecycle state machine, and the projection onto the contract snapshot."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "platform_operations"
path = "src/lib.rs"

[dependencies]
ratatoskr-platform-core.workspace        = true
ratatoskr-platform-persistence.workspace = true
ratatoskr-platform-telemetry.workspace  = true
metrics.workspace    = true
ratatoskr-platform-eventing.workspace    = true
ratatoskr-identifiers.workspace          = true
ratatoskr-operation-contracts.workspace  = true
ratatoskr-error-contracts.workspace      = true
sqlx.workspace      = true
serde.workspace      = true
serde_json.workspace = true
uuid.workspace      = true
time.workspace      = true
jiff.workspace      = true
thiserror.workspace = true
tracing.workspace   = true

[dev-dependencies]
# The disposable-database harness. Every statement in this crate runs against a real PostgreSQL in
# the integration suite, which is what replaces the compile-time checking the `sqlx::query!` macros
# would give.
ratatoskr-platform-persistence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
async-nats.workspace = true

[lints]
workspace = true
