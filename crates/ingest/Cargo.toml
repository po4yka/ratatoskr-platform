[package]
name        = "ratatoskr-platform-ingest"
description = "Generic ingress: webhook sources, safe normalization, and routing to a bounded context."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "platform_ingest"
path = "src/lib.rs"

[dependencies]
ratatoskr-platform-core.workspace        = true
ratatoskr-platform-persistence.workspace = true
ratatoskr-platform-identity.workspace    = true
ratatoskr-platform-operations.workspace  = true
ratatoskr-platform-eventing.workspace    = true
ratatoskr-platform-idempotency.workspace = true
ratatoskr-platform-http.workspace        = true
ratatoskr-platform-telemetry.workspace   = true
ratatoskr-platform-api-doc.workspace     = true
ratatoskr-error-contracts.workspace      = true
axum = { workspace = true, features = ["tokio"] }
sqlx.workspace       = true
http.workspace       = true
sha2.workspace       = true
schemars.workspace   = true
serde.workspace      = true
serde_json.workspace = true
uuid.workspace       = true
jiff.workspace       = true
time.workspace       = true
thiserror.workspace  = true
tracing.workspace    = true

[dev-dependencies]
ratatoskr-platform-persistence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util.workspace = true

[lints]
workspace = true
