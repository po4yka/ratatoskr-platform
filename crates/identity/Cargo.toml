[package]
name        = "ratatoskr-platform-identity"
description = "The identity schema: users, external identities, devices, sessions, refresh tokens, assertions, grants, revocations and audit."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "platform_identity"
path = "src/lib.rs"

[dependencies]
ratatoskr-platform-core.workspace        = true
ratatoskr-platform-persistence.workspace = true
ratatoskr-identifiers.workspace          = true
sqlx.workspace      = true
uuid.workspace      = true
time.workspace      = true
jiff.workspace      = true
thiserror.workspace = true
tracing.workspace   = true

[dev-dependencies]
# The disposable-database harness. Every statement in this crate runs against a real PostgreSQL in
# the integration suite, which is what replaces the compile-time checking the `sqlx::query!` macros
# would give.
ratatoskr-platform-persistence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
