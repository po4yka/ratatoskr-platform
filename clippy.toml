msrv = "1.97"

# Test bodies may assert with unwrap/expect; production code may not (the workspace lints deny both).
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::time::SystemTime", reason = "use ratatoskr_identifiers::WireTimestamp" },
]

disallowed-methods = [
  { path = "std::env::var",    reason = "configuration is read only by platform_core::config" },
  { path = "std::env::var_os", reason = "configuration is read only by platform_core::config" },
]
